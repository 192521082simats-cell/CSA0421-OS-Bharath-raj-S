services:
  portal:
    build: .
    image: result-portal
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: resultsdb
    volumes:
      - dbdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

volumes:
  dbdata:
